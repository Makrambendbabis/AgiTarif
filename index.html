<style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openWith(pwd){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(CT));
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem("agt-pwd", pwd); } catch(e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const b = document.getElementById("b"), err = document.getElementById("e");
  b.disabled = true; err.textContent = "Ouverture…";
  try { await openWith(document.getElementById("p").value); }
  catch(x) { err.textContent = "Mot de passe incorrect."; b.disabled = false; }
});
try { const s = sessionStorage.getItem("agt-pwd"); if (s) openWith(s).catch(()=>{}); } catch(e) {}
